name: Module and addon checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survival:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Verify source snapshot, model and WotLK addon
        run: python3 tools/check.py
      - name: Build release archives
        run: python3 tools/package_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Sylvania-Challenges-packages
          path: dist/*
